# Runs the same checks as the pre-commit hook, so main stays protected even if a hook is skipped.
# Keep this in step with `npm run verify` in package.json and with CLAUDE.md "Commit standards".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 09:00 UTC. New security advisories appear without any commit, so check weekly.
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pre-commit hooks make no sense on a CI runner.
  HUSKY: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint needs the commit history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages (Conventional Commits)
        if: github.event_name != 'schedule'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "$BEFORE_SHA" --to "$PUSH_SHA" --verbose
          else
            npx commitlint --last --verbose
          fi

      - name: Dependency check
        run: npm run deps:check

      - name: Security audit
        run: npm run audit:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
